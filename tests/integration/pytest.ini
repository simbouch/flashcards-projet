[pytest]
# Dedicated config for host-level E2E tests.
# Keeps collection limited to tests/integration and prevents loading parent conftest.py.

# IMPORTANT: run from the repo root (host):
#   python -m pytest -c tests/integration/pytest.ini -q
#
# We do NOT want to import any conftest from the repo when running on the host.
# Also, we pass an explicit test file so pytest does not fall back to the repo's
# default testpaths (which include service/unit tests requiring extra deps).
addopts = --noconftest tests/integration/test_app_integration.py

# Kept for clarity/documentation; collection is driven by the explicit arg above.
testpaths = .
norecursedirs = images __pycache__
markers =
    e2e: End-to-end tests that hit running docker services on localhost

